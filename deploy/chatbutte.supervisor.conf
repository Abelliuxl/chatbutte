[program:chatbutte]
command=/usr/local/bin/node /home/ubuntu/chatbutte/server/index.mjs
directory=/home/ubuntu/chatbutte
environment=NODE_ENV="production",HOST="127.0.0.1",PORT="8080",CHATBUTTE_ORIGINS="https://liuxl.com.cn,https://www.liuxl.com.cn,https://1.14.11.94",CHATBUTTE_PUBLIC="1",CHATBUTTE_TRUST_PROXY="loopback"
autostart=true
autorestart=true
user=ubuntu
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=8
redirect_stderr=true
stdout_logfile=/var/log/supervisor/chatbutte.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
